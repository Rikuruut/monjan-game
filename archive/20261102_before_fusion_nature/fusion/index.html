<!DOCTYPE html>
<html lang="ja" data-theme="fusion">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンじゃん! ゆうごうの うず</title>
  <!-- フォントは手元に置いてある(ガチャのテーマと同じ。SIL Open Font License。ネットが切れても字体が変わらないように) -->
  <link rel="stylesheet" href="/static/vendor/fonts/gacha.css">
  <link rel="stylesheet" href="/static/common/common.css">
  <link rel="stylesheet" href="/static/themes/fusion/style.css">
</head>
<body>

<!--
  テーマ:fusion「ゆうごうの うず」
  宇宙に浮かぶ青い融合のうずへ、左右から写真と動物が吸いこまれ、回りながらまざる。
  最後は、うずが中心の一点に縮んで止まり、白い閃光と衝撃波とともに はじけて、カードが生まれる。
  動き(撮影・生成・場面の進行・開発者メニュー)は /static/common/app.js が共通で受け持つ。
  app.js が使う要素(ID)は、app.js の先頭の「テーマとの約束」を参照。
  進み具合は #stage の data-level(0〜5)で うずの腕と光の帯の明るさ、--progress(0〜1)で 中心の光の大きさ に変える(style.css)。
-->
<div id="stage" class="stage" data-scene="s1" data-level="0">

  <!-- 宇宙:星と、ゆっくり回る星雲 -->
  <div class="space" aria-hidden="true">
    <span class="stars stars-far"></span>
    <span class="stars stars-near"></span>
    <span class="nebula"></span>
  </div>

  <!-- 上:タイトルと、いまの段階 -->
  <header class="top">
    <div class="signboard">
      <h1>モンじゃん! <small>ゆうごうの うず</small></h1>
    </div>
    <ol class="lamps" aria-label="いまの だんかい">
      <li data-step="s1"><span class="lamp"></span>とる</li>
      <li data-step="s2"><span class="lamp"></span>あわせる</li>
      <li data-step="s3"><span class="lamp"></span>がったい</li>
      <li data-step="s4"><span class="lamp"></span>たんじょう</li>
    </ol>
  </header>

  <!-- 場面ごとの大きな見出し -->
  <h2 id="headline" class="headline">スマホで しゃしんを とってね</h2>

  <section class="scene-art" aria-label="ゆうごうの うず">

    <!-- 左右の玉から、うずへ流れる光の帯 -->
    <svg class="streams" viewBox="0 0 1920 1080" aria-hidden="true">
      <path class="stream" d="M 500 450 C 570 380, 640 400, 700 490" />
      <path class="stream" d="M 1420 450 C 1350 380, 1280 400, 1220 490" />
    </svg>

    <!-- 左:しゃしん -->
    <div class="orb-item orb-left">
      <div class="orb">
        <span class="orb-ring"></span>
        <img id="photo" class="orb-photo" alt="">
        <span class="orb-empty">📷</span>
      </div>
      <p class="tag">しゃしん</p>
    </div>

    <!-- 右:どうぶつ -->
    <div class="orb-item orb-right">
      <div class="orb">
        <span class="orb-ring"></span>
        <span id="animal-icon" class="orb-icon"></span>
        <span class="orb-empty">🐾</span>
      </div>
      <p id="animal-name" class="tag">どうぶつ</p>
    </div>

    <!-- 中央:融合のうず(600×600。中心は舞台の (960, 520)) -->
    <div class="vortex-area">
      <!-- うずそのもの。誕生のとき effects.js がこの箱ごと回して縮める(中の層は CSS で回り続ける) -->
      <div class="vortex">

        <div class="vortex-disc"></div>

      <div class="inflow" aria-hidden="true"></div>
      <p id="center-mark" class="center-mark">?</p>
      <!-- 誕生:中心の一点の光と、衝撃波の輪 -->
      <span class="vortex-point" aria-hidden="true"></span>
      <span class="shock shock-1" aria-hidden="true"></span>
      <span class="shock shock-2" aria-hidden="true"></span>
      <p id="center-sub" class="center-sub">スマホで どうぶつを えらんで「とる!」を おしてね</p>
    </div>

    <!-- がったい中:左は「あそびかた」、右は「なまえ」、中央の下は進み具合 -->
    <aside class="board board-left">
      <h3>あそびかた</h3>
      <p id="tip" class="tip"></p>
    </aside>
    <aside class="board board-right">
      <h3>なまえ</h3>
      <p id="name-help" class="name-help">スマホで えらんでね</p>
      <ul id="name-list" class="name-list"></ul>
    </aside>
    <div class="status-plate">
      <ol class="status-steps">
        <li id="st-naming">なまえを かんがえているよ</li>
        <li id="st-drawing">え を かいているよ</li>
        <li id="st-soon">もうすぐ!</li>
      </ol>
    </div>

    <!-- たんじょう:モンスターのカード(光のふちどり) -->
    <article id="card" class="card">
      <header class="card-head">
        <span id="card-name" class="card-name">???</span>
        <span id="card-element" class="card-element"></span>
      </header>
      <div class="card-art"><img id="card-img" alt=""></div>
      <footer class="card-foot">
        <p id="card-recipe" class="card-recipe"></p>
        <p id="card-desc" class="card-desc"></p>
      </footer>
    </article>
  </section>

  <!-- 下:操作盤(3つのボタン。キーボードの ← / Enter / → でも押せる) -->
  <footer class="deck">
    <button id="btn-left" class="knob knob-side" data-pos="left"><span class="knob-face"></span><span class="knob-label"></span></button>
    <button id="btn-center" class="knob knob-main" data-pos="center"><span class="knob-face"></span><span class="knob-label"></span></button>
    <button id="btn-right" class="knob knob-side" data-pos="right"><span class="knob-face"></span><span class="knob-label"></span></button>
  </footer>

  <!-- 短いお知らせ -->
  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <!-- 誕生:はじけて飛び散る光のかけら(effects.js が描く)と、画面ぜんたいの閃光 -->
  <div id="fx-shards" class="fx-particles" aria-hidden="true"></div>
  <div class="fx-flash" aria-hidden="true"></div>

  <!-- 場面転換:うずが画面いっぱいに広がっておおい、また縮んで消える(#stage に class="shut" が付いているあいだ、画面をおおう) -->
  <div class="warp" aria-hidden="true"></div>
</div>

<!-- 演出のライブラリ(ネットにつながっていなくても動くように、static/vendor/ に置いてある) -->
<script src="/static/vendor/gsap/gsap.min.js"></script>

<script src="/static/vendor/tsparticles/tsparticles.bundle.min.js"></script>

<script src="/static/vendor/howler/howler.core.min.js"></script>
<script src="/static/common/sound.js"></script>
<script src="/static/common/app.js"></script>
</body>
