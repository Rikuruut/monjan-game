<!DOCTYPE html>
<html lang="ja" data-theme="fantasy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンじゃん! モンスターのたまご</title>
  <!-- フォント(どちらも SIL Open Font License。イベントでの利用も可)。ネットにつながらないときは丸ゴシックで表示される -->
  <!-- フォントは手元に置いてある(ネットが切れても字体が変わらないように) -->
  <link rel="stylesheet" href="/static/vendor/fonts/fantasy.css">
  <link rel="stylesheet" href="/static/common/common.css">
  <link rel="stylesheet" href="/static/themes/fantasy/style.css">
</head>
<body>

<!--
  テーマ:fantasy「モンスターの たまご」
  森の空き地で、写真と動物の力が大きなたまごに注がれ、ひびが増えていって、最後に割れて生まれる。
  動き(撮影・生成・場面の進行・開発者メニュー)は /static/common/app.js が共通で受け持つ。
  app.js が使う要素(ID)は、app.js の先頭の「テーマとの約束」を参照。
  進み具合は #stage の --progress(0〜1)で、たまごのひびを少しずつ伸ばす(style.css)。
-->
<div id="stage" class="stage" data-scene="s1" data-level="0">

  <!-- 木もれ日と、左右の木 -->
  <div class="forest" aria-hidden="true">
    <span class="tree tree-l1"></span><span class="tree tree-l2"></span>
    <span class="tree tree-r1"></span><span class="tree tree-r2"></span>
    <span class="ray r1"></span><span class="ray r2"></span><span class="ray r3"></span>
  </div>

  <!-- 上:木の看板と、いまの段階(たまごの印) -->
  <header class="top">
    <div class="signboard">
      <h1>モンじゃん! <small>モンスターの たまご</small></h1>
    </div>
    <ol class="lamps" aria-label="いまの だんかい">
      <li data-step="s1"><span class="lamp"></span>とる</li>
      <li data-step="s2"><span class="lamp"></span>あわせる</li>
      <li data-step="s3"><span class="lamp"></span>がったい</li>
      <li data-step="s4"><span class="lamp"></span>たんじょう</li>
    </ol>
  </header>

  <!-- 場面ごとの大きな見出し -->
  <h2 id="headline" class="headline">スマホで しゃしんを とってね</h2>

  <section class="scene-art" aria-label="モンスターの たまご">

    <!-- 巣からたまごへ流れる光の帯 -->
    <svg class="streams" viewBox="0 0 1920 1080" aria-hidden="true">
      <path class="stream" d="M 520 470 C 620 380, 700 380, 790 470" />
      <path class="stream" d="M 1400 470 C 1300 380, 1220 380, 1130 470" />
    </svg>

    <!-- 左の巣:しゃしん -->
    <div class="nest-item nest-left">
      <div class="orb">
        <img id="photo" class="orb-photo" alt="">
        <span class="orb-empty">📷</span>
      </div>
      <div class="nest"></div>
      <p class="tag">しゃしん</p>
    </div>

    <!-- 右の巣:どうぶつ -->
    <div class="nest-item nest-right">
      <div class="orb">
        <span id="animal-icon" class="orb-icon"></span>
        <span class="orb-empty">🐾</span>
      </div>
      <div class="nest"></div>
      <p id="animal-name" class="tag">どうぶつ</p>
    </div>

    <!-- 中央:大きな巣と、モンスターのたまご -->
    <div class="egg-area">
      <div class="egg-glow"></div>
      <!-- ひびからもれる光の粒(effects.js が描く) -->
      <div id="egg-particles" class="fx-particles" aria-hidden="true"></div>
      <div class="egg">
        <div class="shell shell-bottom"></div>
        <div class="shell shell-top"></div>
        <!-- ひび(--progress にあわせて、てっぺんから少しずつ伸びて枝分かれする)
             --a:伸び始める進み具合 / --w:伸びきるまでの幅(どちらも 0〜1)。pathLength="100" で長さをそろえている -->
        <svg class="cracks" viewBox="0 0 380 480" aria-hidden="true">
          <!-- てっぺんの大きなひび -->
          <path class="crack main" pathLength="100" style="--a:0.04;--w:0.14" d="M 190 34 L 178 80 L 200 105" />
          <path class="crack main" pathLength="100" style="--a:0.18;--w:0.14" d="M 200 105 L 184 150 L 205 178" />
          <!-- 左右に枝分かれ -->
          <path class="crack" pathLength="100" style="--a:0.30;--w:0.10" d="M 178 80 L 140 98 L 128 130" />
          <path class="crack" pathLength="100" style="--a:0.37;--w:0.10" d="M 200 105 L 240 118 L 252 150" />
          <path class="crack" pathLength="100" style="--a:0.44;--w:0.10" d="M 128 130 L 96 160 L 104 196 L 70 222" />
          <path class="crack" pathLength="100" style="--a:0.50;--w:0.10" d="M 252 150 L 290 175 L 280 210 L 315 238" />
          <path class="crack" pathLength="100" style="--a:0.56;--w:0.10" d="M 205 178 L 190 222 L 214 254" />
          <!-- 細かいひび -->
          <path class="crack thin" pathLength="100" style="--a:0.62;--w:0.06" d="M 96 160 L 64 150" />
          <path class="crack thin" pathLength="100" style="--a:0.65;--w:0.06" d="M 290 175 L 324 165" />
          <!-- たまごのおなかを一周しはじめる -->
          <path class="crack" pathLength="100" style="--a:0.70;--w:0.10" d="M 70 222 L 58 262 L 100 282 L 140 268" />
          <path class="crack" pathLength="100" style="--a:0.76;--w:0.10" d="M 315 238 L 326 276 L 285 294 L 245 280" />
          <path class="crack" pathLength="100" style="--a:0.83;--w:0.08" d="M 140 268 L 175 290 L 214 254 L 245 280" />
          <!-- 最後のこまかい割れ -->
          <path class="crack thin" pathLength="100" style="--a:0.88;--w:0.06" d="M 160 300 L 148 340" />
          <path class="crack thin" pathLength="100" style="--a:0.90;--w:0.06" d="M 232 300 L 250 336" />
          <path class="crack thin" pathLength="100" style="--a:0.92;--w:0.05" d="M 140 98 L 116 84" />
          <path class="crack thin" pathLength="100" style="--a:0.93;--w:0.05" d="M 240 118 L 262 98" />
        </svg>
        <p id="center-mark" class="center-mark">?</p>
      </div>
      <div class="big-nest"></div>
      <p id="center-sub" class="center-sub">スマホで どうぶつを えらんで「とる!」を おしてね</p>
      <!-- 誕生でとびちる 殻のかけら -->
      <span class="chip"></span><span class="chip"></span><span class="chip"></span><span class="chip"></span>
      <span class="chip"></span><span class="chip"></span><span class="chip"></span><span class="chip"></span>
    </div>

    <!-- がったい中:左は「あそびかた」、右は「なまえ」、中央の下は進み具合(木の立て札) -->
    <aside class="board board-left">
      <h3>あそびかた</h3>
      <p id="tip" class="tip"></p>
    </aside>
    <aside class="board board-right">
      <h3>なまえ</h3>
      <p id="name-help" class="name-help">スマホで えらんでね</p>
      <ul id="name-list" class="name-list"></ul>
    </aside>
    <div class="status-plate">
      <ol class="status-steps">
        <li id="st-naming">なまえを かんがえているよ</li>
        <li id="st-drawing">え を かいているよ</li>
        <li id="st-soon">もうすぐ!</li>
      </ol>
    </div>

    <!-- たんじょう:モンスターのカード(木の額にツタ) -->
    <article id="card" class="card">
      <span class="vine vine-tl"></span><span class="vine vine-br"></span>
      <header class="card-head">
        <span id="card-name" class="card-name">???</span>
        <span id="card-element" class="card-element"></span>
      </header>
      <div class="card-art"><img id="card-img" alt=""></div>
      <footer class="card-foot">
        <p id="card-recipe" class="card-recipe"></p>
        <p id="card-desc" class="card-desc"></p>
      </footer>
    </article>
  </section>

  <!-- 下:木の操作盤(3つのボタン。キーボードの ← / Enter / → でも押せる) -->
  <footer class="deck">
    <button id="btn-left" class="knob knob-side" data-pos="left"><span class="knob-face"></span><span class="knob-label"></span></button>
    <button id="btn-center" class="knob knob-main" data-pos="center"><span class="knob-face"></span><span class="knob-label"></span></button>
    <button id="btn-right" class="knob knob-side" data-pos="right"><span class="knob-face"></span><span class="knob-label"></span></button>
  </footer>

  <!-- 短いお知らせ -->
  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <!-- 誕生のときに舞う葉っぱの紙吹雪(effects.js が描く) -->
  <div id="fx-confetti" class="fx-particles" aria-hidden="true"></div>

  <!-- 場面転換:葉っぱの群れが画面を横切る(#stage に class="shut" が付いているあいだ、画面をおおう) -->
