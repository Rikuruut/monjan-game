<!--
  テーマ:fusion「たんじょうのもり」(2026年11月2日。宇宙のうず → しぜんのうず → いまの形に作りかえた。元は archive/20261102_before_fusion_*/)
  深い森の奥で、葉っぱ・花びら・光の粒がつむじ風になって回る。写真と動物の玉は、うずのまわりを回りながら近づいて吸いこまれる。
  最後は、うずが中心の一点に縮んで止まり、風が はじけて 葉と花びらが舞い、カードが生まれる。
  動き(撮影・生成・場面の進行・開発者メニュー)は /static/common/ の JavaScript(core.js・dev.js・boot.js)が共通で受け持つ。
  使う要素(ID)は、core.js の先頭の「テーマとの約束」を参照。
  進み具合は #stage の data-level(0〜5)で うずの腕と光の帯の明るさ、--progress(0〜1)で 中心の光の大きさ と 玉が回る輪の大きさ に変える(style.css)。
-->

    <span class="vignette"></span>
    <span class="ground-glow"></span>
    <span class="drift" style="left:180px;--d:0s;--t:13s"></span>
    <span class="drift" style="left:520px;--d:-4s;--t:15s"></span>
    <span class="drift petal" style="left:820px;--d:-9s;--t:17s"></span>
    <span class="drift" style="left:1240px;--d:-2s;--t:14s"></span>
    <span class="drift petal" style="left:1520px;--d:-7s;--t:16s"></span>
    <span class="drift" style="left:1760px;--d:-11s;--t:13s"></span>
  </div>

  <!-- 上:タイトルと、いまの段階 -->

    <div class="signboard">
      <h1>モンじゃん! <small>たんじょうのもり</small></h1>
    </div>
    <ol class="lamps" aria-label="いまの だんかい">
      <li data-step="s1"><span class="lamp"></span>とる</li>
      <li data-step="s2"><span class="lamp"></span>あわせる</li>
      <li data-step="s3"><span class="lamp"></span>がったい</li>
      <li data-step="s4"><span class="lamp"></span>たんじょう</li>
    </ol>
  </header>

      </div>
      <!-- 吸いこまれる 葉・花びら・光の粒・風の筋(effects.js が足す) -->
      <div class="inflow" aria-hidden="true"></div>
      </div>
      <p id="center-mark" class="center-mark">?</p>
      <!-- 誕生:中心の一点の光、はじける風(白い風の三日月8枚。--i で向きを変える)、衝撃波の輪 -->
      <span class="vortex-point" aria-hidden="true"></span>
      <div class="gust" aria-hidden="true">
        <span class="blade" style="--i:0"></span><span class="blade" style="--i:1"></span>
        <span class="blade" style="--i:2"></span><span class="blade" style="--i:3"></span>
        <span class="blade" style="--i:4"></span><span class="blade" style="--i:5"></span>
        <span class="blade" style="--i:6"></span><span class="blade" style="--i:7"></span>
      </div>
      <span class="shock shock-1" aria-hidden="true"></span>
      <span class="shock shock-2" aria-hidden="true"></span>
      <p id="center-sub" class="center-sub">スマホで どうぶつを えらんで「とる!」を おしてね</p>
    </div>

    <!-- がったい中:中央の下に進み具合。
         「あそびかた」と「なまえ」の立て札は、core.js が使う ID なので置いておくが、このテーマでは出さない(うずを広く見せるため。style.css) -->
    <aside class="board board-left">
      <h3>あそびかた</h3>
      <p id="tip" class="tip"></p>
    </aside>
    <aside class="board board-right">
      <h3>なまえ</h3>
      <p id="name-help" class="name-help">スマホで えらんでね</p>
      <ul id="name-list" class="name-list"></ul>
    </aside>
    <div class="status-plate">
      <ol class="status-steps">
        <li id="st-naming">なまえを かんがえているよ</li>
        <li id="st-drawing">え を かいているよ</li>
        <li id="st-soon">もうすぐ!</li>
      </ol>
    </div>

    <!-- たんじょう:モンスターのカード(緑と桃のふちどり) -->
    <article id="card" class="card">
      <header class="card-head">
        <span id="card-name" class="card-name">???</span>
        <span id="card-element" class="card-element"></span>
      </header>
      <div class="card-art"><img id="card-img" alt=""></div>
      <footer class="card-foot">
        <p id="card-recipe" class="card-recipe"></p>
        <p id="card-desc" class="card-desc"></p>
      </footer>
    </article>
  </section>

  <!-- 下:操作盤(3つのボタン。キーボードの ← / Enter / → でも押せる) -->
  <footer class="deck">
    <button id="btn-left" class="knob knob-side" data-pos="left"><span class="knob-face"></span><span class="knob-label"></span></button>
    <button id="btn-center" class="knob knob-main" data-pos="center"><span class="knob-face"></span><span class="knob-label"></span></button>
    <button id="btn-right" class="knob knob-side" data-pos="right"><span class="knob-face"></span><span class="knob-label"></span></button>
  </footer>

  <!-- 短いお知らせ -->
  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <!-- 誕生:舞い散る 葉と花びら(effects.js が描く)と、画面ぜんたいの閃光 -->
  <div id="fx-shards" class="fx-particles" aria-hidden="true"></div>
  <div class="fx-flash" aria-hidden="true"></div>

  <!-- 場面転換:上から木もれ日の光が差して画面をおおい、光が引くと次の場面(#stage に class="shut" が付いているあいだ、画面をおおう) -->
  <div class="warp" aria-hidden="true"></div>
</div>

<!-- 効果音と BGM(Howler.js。static/vendor/ に置いてある)。BGM が早く鳴りはじめるよう、演出のライブラリより先に読む -->
<script src="/static/vendor/howler/howler.core.min.js"></script>
<script src="/static/common/sound.js"></script>
<!-- 演出のライブラリ(ネットにつながっていなくても動くように、static/vendor/ に置いてある) -->
<script src="/static/vendor/gsap/gsap.min.js"></script>
<script src="/static/vendor/gsap/SplitText.min.js"></script>
<script src="/static/vendor/tsparticles/tsparticles.bundle.min.js"></script>
<script src="/static/themes/fusion/effects.js"></script>
<script src="/static/common/shared.js"></script>
<script src="/static/common/core.js"></script>
<script src="/static/common/dev.js"></script>
<script src="/static/common/boot.js"></script>
</body>
</html>
